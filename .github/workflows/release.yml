# Publish tmap to PyPI (tmap-agents) and attach install.sh to the release, on a v* tag.
#
# The whole CI workflow runs first (tests, lint, types, the Ghidra integration, the built wheel);
# nothing is published unless every job of it passes. Refuses to publish a lock that still carries
# a placeholder (the BinExport build must be
# published first by the BinExport workflow and its values merged), a tag that does not match
# treasure_map.version.__version__, a CHANGELOG.md with no section for that version (the section
# is the release's body), or a wheel that installs without its commit.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Pass the caller's secrets through: a reusable workflow gets none by default, so without
    # this the release-time vendor-neutrality check would silently run on the brand-free example
    # only, never the private watchlist held as the TM_VENDOR_WATCHLIST repository secret.
    secrets: inherit
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Tag matches the version; clean tree; CHANGELOG section for the release body
        run: |
          set -e
          V="$(python -c 'import runpy; print(runpy.run_path("src/treasure_map/version.py")["__version__"])')"
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME != v$V"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { git status; exit 1; }
          python scripts/changelog_section.py "$V" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Bake the commit into the wheel
        run: printf 'COMMIT = "%s"\n' "$GITHUB_SHA" > src/treasure_map/_build_info.py

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Wheel contents (the one asset list, plus the baked commit)
        run: python scripts/wheel_assets.py dist/*.whl --with-build-info

      - name: Install from the index form (no direct_url.json) and check
        run: |
          set -e
          python -m venv /tmp/v
          # dependencies from the index; then tmap itself again by name from dist/ alone
          # (never by file path: that would write a direct_url.json and skip the baked commit)
          /tmp/v/bin/pip install --find-links dist "tmap-agents==$V"
          /tmp/v/bin/pip install --force-reinstall --no-deps --no-index --find-links dist "tmap-agents==$V"
          [ "$(/tmp/v/bin/tmap --version)" = "tmap $V" ]
          [ "$(/tmp/v/bin/python -c 'from treasure_map.version import installed_commit; print(installed_commit())')" = "$GITHUB_SHA" ]

      # Read by the installed tmap (-I: never the checkout's src/), whose dependencies the venv has.
      - name: The shipped lock has no placeholder
        run: |
          set -e
          /tmp/v/bin/python -I - <<'PY'
          import glob, json, sys, zipfile
          from treasure_map.lib.setup.toolchain_lock import parse_lock, placeholders
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          left = placeholders(parse_lock(json.loads(wheel.read("treasure_map/lib/setup/toolchain_lock.json"))))
          if left:
              sys.exit(f"toolchain_lock.json still has placeholders: {left}")
          PY

      # The release is drafted first (a draft is never "latest", so the install URL does not move
      # yet), then the package goes to PyPI, then the draft is published as latest. A failure at
      # any step leaves a re-runnable state: the draft is updated in place, PyPI skips a version
      # it already has. The body is this version's CHANGELOG section, set again on a re-run.
      - name: Draft the release with install.sh and the CHANGELOG section (this version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p upload
          sed "s/^TMAP_VERSION=\"__TMAP_VERSION__\"\$/TMAP_VERSION=\"$V\"/" install.sh > upload/install.sh
          grep -q "^TMAP_VERSION=\"$V\"\$" upload/install.sh
          sh upload/install.sh --dry-run --no-init </dev/null
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" upload/install.sh --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" upload/install.sh --draft \
              --title "tmap $V" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

      - name: Publish the release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
