[project]
name = "treasure-map"
version = "0.1.0"
description = "IoT firmware patch diff and exploit-path discovery"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "JoeyZzZzZz", email = "86097996+JoeyZzZzZz@users.noreply.github.com"}
]
keywords = ["iot", "firmware", "security", "reverse-engineering", "patch-diff"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pyelftools>=0.31",
    "openai>=1.30",
    "anthropic>=0.28",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
# The AI-facing MCP server. Optional: the analysis/CLI core does not require it, so the server
# module imports `mcp` lazily and only `tmap mcp-serve` / the MCP entry point pulls it in.
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0",
    "mcp>=1.0",
]

[project.scripts]
tmap = "treasure_map.cli.main:main"
treasure-map-mcp = "treasure_map.mcp_app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py runtime assets MUST be listed here or the built wheel silently omits them
# (a pipx/pip install would then fail at analyze/schema time). Editable installs hide
# this because they run from the source tree. Extend these globs for any new asset.
[tool.setuptools.package-data]
"treasure_map.lib.analyze.ghidra" = ["*.java"]
"treasure_map.lib.storage" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "elftools.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "treasure_map.lib.analyze.elf_inventory"
disable_error_code = ["no-untyped-call", "attr-defined"]
