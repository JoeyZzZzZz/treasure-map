[project]
name = "tmap-agents"
dynamic = ["version"]
description = "A firmware map for your AI agent. Treasure Map draws the map; your agent finds the treasure."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "JoeyZzZzZz", email = "86097996+JoeyZzZzZz@users.noreply.github.com"}
]
keywords = ["iot", "firmware", "security", "reverse-engineering", "patch-diff"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pyelftools>=0.31",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    # The AI-facing MCP server is the substrate's primary consumer entry point, not an add-on:
    # `tmap mcp` must connect out of the box on any install, so its SDK is a core dependency
    # (imported at module top level like every other core dep, never behind an extra).
    "mcp>=1.0,<2",  # 2.0 removed mcp.server.fastmcp (used by mcp_app); pin until we migrate the API
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
tmap = "treasure_map.cli.main:main"

[project.urls]
Homepage = "https://github.com/JoeyZzZzZz/treasure-map"
Repository = "https://github.com/JoeyZzZzZz/treasure-map"
Changelog = "https://github.com/JoeyZzZzZz/treasure-map/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "treasure_map.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py runtime assets MUST be listed here or the built wheel silently omits them
# (a pipx/pip install would then fail at analyze/schema time). Editable installs hide
# this because they run from the source tree. Extend these globs for any new asset.
[tool.setuptools.package-data]
"treasure_map.lib.analyze.ghidra" = ["*.java", "*.tsv"]
"treasure_map.lib.diff.ghidra" = ["*.java"]
"treasure_map.lib.storage" = ["*.sql"]
"treasure_map.lib.setup" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "elftools.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "treasure_map.lib.analyze.elf_inventory"
disable_error_code = ["no-untyped-call", "attr-defined"]
