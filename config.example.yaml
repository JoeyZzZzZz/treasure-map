# Treasure Map configuration example
# `tmap init` writes ~/.treasure-map/config.yaml for you; this file shows every key. Analysis is
# hermetic (no network calls) — there are no API keys to fill in. A relative path is read from the
# directory the config file is in, never from where tmap is run.

ghidra:
  headless_timeout_seconds: 300
  max_parallel_jvms: 4   # `tmap init` overwrites this with a value derived from the machine
                         #   (physical cores + memory); `tmap init --force` re-detects it

  local:
    home: ~      # null = auto-discover via GHIDRA_HOME env or PATH; or set explicit path
    # home: /path/to/ghidra_11.4.3_PUBLIC   # Ghidra 11.4.3 is the pinned, tested toolchain

# toolchain: the JDK and BinDiff tmap runs. `tmap init` writes these; when set, every tmap command
# puts them first in its own environment (JAVA_HOME and PATH) before starting Ghidra or BinDiff —
# also `tmap mcp` started by an agent with a bare PATH. Unset (null) = the environment is left as is.
toolchain:
  java_home: ~     # a JDK 21 root (bin/java and bin/javac)
  bindiff: ~       # the bindiff executable, e.g. ~/.treasure-map/toolchain/bindiff-8/opt/bindiff/bin/bindiff

workspace_dir: ~/.treasure-map/workspaces

# atlas: persistent cross-firmware pattern store (see lib/atlas/).
# Moving atlas.db requires sqlite3.backup() — never a bare cp while WAL files exist.
# atlas:
#   db_path: ~/.treasure-map/atlas.db

# A library symbol called from many places would put callers × exporters edges in the xrefs table.
# Above this many edges the symbol is folded instead: its edges are not written, and it is listed
# (with its counts) under folded_xref_symbols, so the omission is visible rather than silent.
xref_fold_edge_threshold: 25000
