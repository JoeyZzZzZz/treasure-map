# Treasure Map configuration example
# Copy to ~/.treasure-map/config.yaml. Analysis is hermetic (no network calls) — there are no
# API keys to fill in.

ghidra:
  mode: local    # 'local' is the only implemented mode
  headless_timeout_seconds: 300
  max_parallel_jvms: 4   # `tmap init` overwrites this with a value derived from the machine
                         #   (physical cores + memory); `tmap init --force` re-detects it

  local:
    home: ~      # null = auto-discover via GHIDRA_HOME env or PATH; or set explicit path
    # home: /path/to/ghidra_11.4.3_PUBLIC   # Ghidra 11.4.3 is the pinned, tested toolchain

  # NOT IMPLEMENTED — there is no container image and no remote service; setting either mode does
  # not work today. The config schema still accepts these keys, so the shape is shown for when one
  # of them is built, commented out so it cannot be mistaken for a working option.
  #
  # docker:
  #   image: <no image is published>
  #
  # remote:
  #   endpoint: http://localhost:8080

workspace_dir: ~/.treasure-map/workspaces

# atlas: persistent cross-firmware pattern store (see lib/atlas/).
# Moving atlas.db requires sqlite3.backup() — never a bare cp while WAL files exist.
# atlas:
#   db_path: ~/.treasure-map/atlas.db

log_level: INFO
